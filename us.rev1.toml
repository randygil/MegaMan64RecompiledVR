	}
	"""

#Offscreen geometry - Props near the camera pass the behind and screen tests ($a0 is a quarter of the depth, the
# projected center is at 0x58($sp))
[[patches.hook]]
func = "func_8003AB60_15F60"
before_vram = 0x8003AC60
text= """
	{
		recomp_context savedCtx = *ctx;
		ctx->r5 = ADD32(savedCtx.r29, 0x58);
		prop_offscreen_cull(rdram, ctx);
		gpr quarterDepth = ctx->r2;
		*ctx = savedCtx;
		ctx->r4 = quarterDepth;
	}
	"""

#Offscreen geometry - Props near the camera pass the behind test ($v1 is a quarter of the depth)
[[patches.hook]]
func = "func_8003AFB0_163B0"
before_vram = 0x8003B04C
text= """
	{
		recomp_context savedCtx = *ctx;
		ctx->r4 = savedCtx.r3;
		ctx->r5 = 0;
		prop_offscreen_cull(rdram, ctx);
		gpr quarterDepth = ctx->r2;
		*ctx = savedCtx;
		ctx->r3 = quarterDepth;
	}
	"""

#Offscreen geometry - Characters near the camera pass the behind and screen tests ($a0 is a quarter of the depth, the
