#Mouse camera - Hitmarker when a flying buster shot ends on an enemy ($s1 is the shot). Enemies mark the shots that hit
# them in the top byte of 0xC8; the collision pass leaves other entities it touched at 0x7C.
[[patches.hook]]
func = "func_8007BA60_56E60"
before_vram = 0x8007BAA8
text =  """
	if (((MEM_W(0xC8, ctx->r17) & 0xFF000000) != 0) || (MEM_H(0x7C, ctx->r17) != 0)) {
		recomp_context savedCtx = *ctx;
		mouse_camera_register_hit(rdram, ctx);
		*ctx = savedCtx;
	}
		"""

