#Offscreen geometry - Tree and bush quads entirely behind the camera aren't dropped by the fade mode 2 walker ($v1 is
# the nearest corner's depth, $s3 $s0 $s1 $s2 the corners' offsets in the table of depths)
[[patches.hook]]
func = "func_8007D798_58B98"
before_vram = 0x8007D918
text= """
	{
		recomp_context savedCtx = *ctx;
		ctx->r4 = savedCtx.r19;
		ctx->r5 = savedCtx.r16;
		ctx->r6 = savedCtx.r17;
		ctx->r7 = savedCtx.r18;
		quad_offscreen_depth(rdram, ctx);
		gpr nearestDepth = ctx->r2;
		*ctx = savedCtx;
		ctx->r3 = nearestDepth;
	}
	"""

#Offscreen geometry - Wall and prop quads entirely behind the camera aren't hidden by the fade mode 3 walker ($v1 is
# the farthest corner's depth)
[[patches.hook]]
func = "func_8007DA78_58E78"
before_vram = 0x8007DC28
text= """
	{
		recomp_context savedCtx = *ctx;
		ctx->r4 = savedCtx.r3;
		quad_offscreen_far_depth(rdram, ctx);
		gpr farthestDepth = ctx->r2;
		*ctx = savedCtx;
		ctx->r3 = farthestDepth;
	}
	"""

#Offscreen geometry - Quads the fade mode 2 walker drops still cast shadows ($v0 is 0 for a dropped quad, $s4 points
# to its G_TRI2)
[[patches.hook]]
func = "func_8007D798_58B98"
before_vram = 0x8007D92C
text= """
	if (ctx->r2 == 0) {
		recomp_context savedCtx = *ctx;
		ctx->r4 = savedCtx.r20;
		quad_shadow_only(rdram, ctx);
		*ctx = savedCtx;
	}
	"""

#Offscreen geometry - Quads the fade mode 3 walker hides still cast shadows (0x44($sp) is 0 for a hidden quad, $s0
# points to its G_TRI2)
[[patches.hook]]
func = "func_8007DA78_58E78"
before_vram = 0x8007DE50
text= """
	if (MEM_W(0x44, ctx->r29) == 0) {
		recomp_context savedCtx = *ctx;
		ctx->r4 = savedCtx.r16;
		quad_shadow_only(rdram, ctx);
		*ctx = savedCtx;
	}
	"""

