# Terrain culling tests each tile's center only: tiles more than 0x80 units behind the camera are dropped, and tiles
# farther than 0x80 units in front get a screen bounds test. Tiles are 512 units wide, so with a camera near the ground
# (first person) the tiles right around it have centers far to the side or behind while their edges are on screen, and
# they got culled. The range is 0x1000 units now (0x600 first, for first person): the shadows of the enhanced lighting
# need the cliffs and ruins beside and behind the camera, whose shadows reach the ground in view, and they popped in
# and out while the camera turned.
[[patches.instruction]]
func = "func_8003912C_1452C"
vram = 0x800397C8
value = 0x2402F000 # addiu $v0, $zero, -0x1000

[[patches.instruction]]
func = "func_8003912C_1452C"
vram = 0x8003980C
value = 0x240D1000 # addiu $t5, $zero, 0x1000

[[patches.instruction]]
func = "func_8003912C_1452C"
vram = 0x80039AB4
value = 0x240D1000 # addiu $t5, $zero, 0x1000

[[patches.instruction]]
func = "func_8003912C_1452C"
vram = 0x80039B5C
value = 0x240D1000 # addiu $t5, $zero, 0x1000

[[patches.instruction]]
func = "func_8003912C_1452C"
vram = 0x80039C54
value = 0x240D1000 # addiu $t5, $zero, 0x1000

# Close objects: these object draws skip anything whose depth in front of the camera is under ~48 units (0x30, or
# 0xC after dividing by 4). The third person camera never gets that close, but a first person or VR camera does, and
# chests or save points vanished when walking up to them. Only objects behind the camera are skipped now.
[[patches.instruction]]
func = "func_8003A2EC_156EC"
vram = 0x8003A3FC
value = 0x24020001 # addiu $v0, $zero, 1

[[patches.instruction]]
func = "func_8003AB60_15F60"
vram = 0x8003AC5C
value = 0x24020001 # addiu $v0, $zero, 1

[[patches.instruction]]
func = "func_8003AFB0_163B0"
vram = 0x8003B04C
value = 0x28620001 # slti $v0, $v1, 1

